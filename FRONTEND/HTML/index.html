<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index - HiddenTale</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/index.css">
</head>
<body>
<div id="navbar-container"></div>
<script src="../JAVASCRIPT/navbar.js"></script>

<div class="Descrizione">
    <div><img src="IMAGES/Logo1.svg"></div>
    <p>Hiddentale: Riscopri la tradizione</p>
</div>

<div class="search-input-wrapper">
    <!-- Icona SVG diretta -->
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#633A1C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>

    <!-- Campo di testo -->
    <input type="text" class="input-search" placeholder="Cerca...">
</div>

<div class="map-banner">
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../JAVASCRIPT/mappa.js"></script>
</div>

<div class="events-section">
    <h2 class="events-title">Eventi nei paraggi</h2>

    <!-- Wrapper per contenere sia le frecce esterne sia il carosello -->
    <div class="carousel-wrapper">
        <!-- Freccia Sinistra -->
        <button class="carousel-btn prev-btn" id="prevBtn" aria-label="Precedente">&#10094;</button>

        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-track" id="carouselTrack">
                <!-- Verrà popolato dinamicamente da carousel.js -->
            </div>
        </div>

        <!-- Freccia Destra -->
        <button class="carousel-btn next-btn" id="nextBtn" aria-label="Successivo">&#10095;</button>
    </div>
</div>

<!-- Aggiunto il collegamento al database degli eventi -->
<script src="../JAVASCRIPT/dati_eventi.js"></script>
<script src="../JAVASCRIPT/carousel.js"></script>
</body>
</html>
